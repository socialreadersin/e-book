      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="240" rx="16" fill="url(#warmBg)"/>
  
  <!-- Smiling Group of 5 School Kids in green uniforms holding books -->
  <g transform="translate(480, 20)">
