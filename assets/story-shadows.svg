<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="mysteryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09050f"/>
      <stop offset="60%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#ff4b1f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#mysteryBg)"/>
  <!-- Arch / Red Door frame -->
  <rect x="90" y="160" width="220" height="340" rx="20" fill="#0d0414" stroke="#ff416c" stroke-width="4"/>
  <rect x="110" y="180" width="180" height="300" rx="10" fill="#ff4b1f" opacity="0.3"/>
  <!-- Detective silhouette in fedora -->
  <g transform="translate(160, 240)">
    <!-- Fedora hat -->
    <ellipse cx="40" cy="24" rx="28" ry="6" fill="#08020a"/>
    <path d="M22,24 C22,10 58,10 58,24 Z" fill="#08020a"/>
    <!-- Head & Coat -->
    <circle cx="40" cy="36" r="10" fill="#08020a"/>
    <path d="M10,180 L20,55 C24,48 56,48 60,55 L70,180 Z" fill="#08020a"/>
    <!-- Collar -->
    <polygon points="30,55 40,75 50,55" fill="#1f0729"/>
  </g>
  <!-- Floor shadow reflections -->
  <ellipse cx="200" cy="480" rx="140" ry="20" fill="#050108" opacity="0.8"/>
</svg>
