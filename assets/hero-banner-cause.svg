<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="causeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#0B2C5D"/>
    </linearGradient>
    <linearGradient id="orangePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowCause" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#causeBg)"/>

  <!-- Glow circles -->
  <circle cx="200" cy="100" r="280" fill="#34D399" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1050" cy="400" r="240" fill="#E8720C" opacity="0.22" filter="blur(50px)"/>

  <!-- Left Content -->
  <g transform="translate(80, 60)">
    <rect width="360" height="38" rx="19" fill="url(#orangePill)" filter="url(#shadowCause)"/>
    <text x="24" y="24" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="14" letter-spacing="1">♥ 25% DIRECT SOCIAL IMPACT</text>
  </g>

  <text x="80" y="160" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">
    Your Read Can
  </text>
  <text x="80" y="220" fill="url(#goldText)" font-family="'Poppins', sans-serif" font-weight="900" font-size="50" letter-spacing="-0.5">
    Change A Young Life.
  </text>

  <text x="80" y="270" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="500" font-size="18">
    25% of every e-book &amp; audiobook purchase funds rural education &amp; sports.
  </text>
  <text x="80" y="300" fill="#6EE7B7" font-family="'Inter', sans-serif" font-weight="600" font-size="16">
    12,450+ Students Supported • 350+ Emerging Athletes Sponsored
  </text>

  <g transform="translate(80, 335)">
    <rect width="210" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)"/>
    <text x="16" y="25" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="14">📚 ₹37.25 from ₹149 Book</text>

    <rect x="225" width="220" height="40" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)"/>
    <text x="240" y="25" fill="#FDE047" font-family="'Inter', sans-serif" font-weight="700" font-size="14">✓ 100% Audited Transparency</text>
  </g>

  <!-- Right Visual Cards (Education + Sports Showcase) -->
  <g transform="translate(740, 50)" filter="url(#shadowCause)">
    <!-- Education Card -->
    <g transform="translate(20, 20)">
      <rect width="360" height="150" rx="20" fill="#064E3B" stroke="rgba(52, 211, 153, 0.4)" stroke-width="2"/>
      <rect x="16" y="16" width="60" height="60" rx="14" fill="#047857"/>
      <text x="46" y="54" fill="#FFFFFF" font-size="30" text-anchor="middle">🎓</text>
      <text x="90" y="45" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="18">Student Education Kits</text>
      <text x="90" y="70" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13">Textbooks, Notebooks &amp; Tuition Aid</text>
      <text x="90" y="125" fill="#34D399" font-family="'Poppins', sans-serif" font-weight="800" font-size="15">12,450+ Beneficiaries</text>
    </g>

    <!-- Sports Card -->
    <g transform="translate(20, 190)">
      <rect width="360" height="150" rx="20" fill="#1E293B" stroke="rgba(251, 146, 60, 0.4)" stroke-width="2"/>
      <rect x="16" y="16" width="60" height="60" rx="14" fill="#C2410C"/>
      <text x="46" y="54" fill="#FFFFFF" font-size="30" text-anchor="middle">🏃‍♂️</text>
      <text x="90" y="45" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="18">Rural Sports Talent</text>
      <text x="90" y="70" fill="#FED7AA" font-family="'Inter', sans-serif" font-size="13">Running Spikes, Gear &amp; Tournament Fees</text>
      <text x="90" y="125" fill="#FB923C" font-family="'Poppins', sans-serif" font-weight="800" font-size="15">350+ Sponsored Athletes</text>
    </g>
  </g>
</svg>
