<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tamilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#0B2C5D"/>
    </linearGradient>
    <linearGradient id="redPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="goldTamil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowTamil" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#tamilBg)"/>
  <circle cx="1050" cy="100" r="280" fill="#F59E0B" opacity="0.18" filter="blur(60px)"/>
  <circle cx="200" cy="400" r="200" fill="#EF4444" opacity="0.2" filter="blur(50px)"/>

  <!-- Left Content -->
  <g transform="translate(80, 60)">
    <rect width="360" height="38" rx="19" fill="url(#redPill)" filter="url(#shadowTamil)"/>
    <text x="24" y="24" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="14" letter-spacing="1">🇮🇳 தமிழ் சிறப்பு மின்னூல்கள்</text>
  </g>

  <text x="80" y="160" fill="#FFFFFF" font-family="'Noto Sans Tamil', 'Poppins', sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">
    வாசிப்போம்! உயர்வோம்!
  </text>
  <text x="80" y="220" fill="url(#goldTamil)" font-family="'Noto Sans Tamil', 'Poppins', sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">
    25% மாணவர் கல்வி நிதிக்கு
  </text>

  <text x="80" y="270" fill="#FEF3C7" font-family="'Inter', sans-serif" font-weight="500" font-size="18">
    Bilingual Tamil &amp; English Masterpieces for Personal Growth &amp; Success.
  </text>
  <text x="80" y="300" fill="#FDE68A" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-weight="600" font-size="16">
    அக்னி சிறகுகள் • அட்டாமிக் ஹாபிட்ஸ் • யு கேன் வின் • ரிச் டாட் புவர் டாட்
  </text>

  <g transform="translate(80, 335)">
    <rect width="210" height="38" rx="10" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
    <text x="16" y="24" fill="#FEF08A" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="13">🇮🇳 தமிழ் &amp; English</text>

    <rect x="225" width="200" height="38" rx="10" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
    <text x="240" y="24" fill="#6EE7B7" font-family="'Inter', sans-serif" font-weight="700" font-size="13">⚡ Start Reading at ₹149</text>
  </g>

  <!-- Right Visual: Showcase of Tamil & English Edition Covers -->
  <g transform="translate(740, 50)" filter="url(#shadowTamil)">
    <g transform="translate(0, 30) rotate(-6)">
      <rect width="180" height="260" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <rect x="10" y="10" width="160" height="240" rx="8" fill="#B45309"/>
      <text x="90" y="105" fill="#FFF" font-family="'Noto Sans Tamil', sans-serif" font-weight="800" font-size="16" text-anchor="middle">அக்னி சிறகுகள்</text>
      <text x="90" y="135" fill="#FEF3C7" font-family="'Noto Sans Tamil', sans-serif" font-size="11" text-anchor="middle">அப்துல் கலாம்</text>
      <rect x="25" y="180" width="130" height="28" rx="14" fill="#78350F"/>
      <text x="90" y="198" fill="#FFF" font-weight="700" font-size="12" text-anchor="middle">₹159 Only</text>
    </g>

    <g transform="translate(180, 20) rotate(8)">
      <rect width="180" height="260" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <rect x="10" y="10" width="160" height="240" rx="8" fill="#047857"/>
      <text x="90" y="105" fill="#FFF" font-family="'Noto Sans Tamil', sans-serif" font-weight="800" font-size="15" text-anchor="middle">இக்கிகாய்</text>
      <text x="90" y="135" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Japanese Secret</text>
      <rect x="25" y="180" width="130" height="28" rx="14" fill="#064E3B"/>
      <text x="90" y="198" fill="#FFF" font-weight="700" font-size="12" text-anchor="middle">₹169 Only</text>
    </g>

    <g transform="translate(85, 10)">
      <rect width="210" height="300" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
      <rect x="12" y="12" width="186" height="276" rx="10" fill="#DC2626"/>
      <rect x="24" y="24" width="120" height="24" rx="6" fill="#991B1B"/>
      <text x="84" y="40" fill="#FFF" font-family="'Noto Sans Tamil', sans-serif" font-weight="800" font-size="10" text-anchor="middle">★ அதிகம் வாசிக்கப்பட்டவை</text>

      <text x="105" y="110" fill="#FFFFFF" font-family="'Noto Sans Tamil', sans-serif" font-weight="900" font-size="18" text-anchor="middle">அட்டாமிக்</text>
      <text x="105" y="138" fill="#FFFFFF" font-family="'Noto Sans Tamil', sans-serif" font-weight="900" font-size="18" text-anchor="middle">ஹாபிட்ஸ்</text>
      <text x="105" y="165" fill="#FEE2E2" font-family="'Noto Sans Tamil', sans-serif" font-weight="700" font-size="12" text-anchor="middle">ஜேம்ஸ் க்ளியர்</text>

      <rect x="24" y="200" width="162" height="42" rx="10" fill="#450A0A"/>
      <text x="105" y="222" fill="#FDE047" font-family="'Poppins', sans-serif" font-weight="800" font-size="15" text-anchor="middle">₹149 <tspan font-size="11" fill="#FCA5A5" text-decoration="line-through">₹299</tspan></text>
      <text x="105" y="236" fill="#86EFAC" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">25% (₹37.25) to Education</text>
    </g>
  </g>
</svg>
