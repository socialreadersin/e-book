<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2C5D" />
      <stop offset="100%" stop-color="#1b4985" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8720C" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
  </defs>

  <!-- Background Decorative Shape -->
  <rect width="600" height="500" rx="32" fill="#F3ECE2" />
  <circle cx="480" cy="120" r="100" fill="#2E7D32" opacity="0.08" />
  <circle cx="120" cy="400" r="120" fill="#0B2C5D" opacity="0.06" />

  <!-- E-Reader / Tablet Device -->
  <g transform="translate(160, 60)">
    <rect x="0" y="0" width="280" height="380" rx="28" fill="#0B2C5D" />
    <rect x="14" y="16" width="252" height="348" rx="18" fill="#FAF7F2" />
    
    <!-- Open Book Illustration inside screen -->
    <g transform="translate(46, 50)">
      <!-- Left Page -->
      <path d="M0,40 Q40,30 80,45 L80,180 Q40,165 0,175 Z" fill="#E8EDF5" />
      <!-- Right Page -->
      <path d="M80,45 Q120,30 160,40 L160,175 Q120,165 80,180 Z" fill="#D3DFEE" />
      
      <!-- Lines of text on pages -->
      <line x1="15" y1="70" x2="65" y2="70" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="15" y1="90" x2="65" y2="90" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="15" y1="110" x2="55" y2="110" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="15" y1="130" x2="60" y2="130" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />

      <line x1="95" y1="70" x2="145" y2="70" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="95" y1="90" x2="145" y2="90" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="95" y1="110" x2="135" y2="110" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <line x1="95" y1="130" x2="140" y2="130" stroke="#0B2C5D" stroke-width="3" stroke-linecap="round" opacity="0.7" />

      <!-- Glowing sprout / knowledge rising -->
      <circle cx="80" cy="30" r="18" fill="url(#glowGrad)" />
      <path d="M72,32 Q80,18 88,32 Z" fill="#FAF7F2" />
    </g>

    <!-- Social Impact Badge on Screen -->
    <rect x="36" y="260" width="208" height="50" rx="14" fill="#0B2C5D" />
    <text x="140" y="282" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#FAF7F2" text-anchor="middle">25% FOR CHANGE</text>
    <text x="140" y="298" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFB74D" text-anchor="middle">Supporting Youth &amp; Sports</text>
  </g>

  <!-- Floating Elements & Badges -->
  <!-- Left Floating Badge: Education -->
  <g transform="translate(60, 180)">
    <rect width="140" height="60" rx="16" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(11,44,93,0.12))" />
    <circle cx="32" cy="30" r="16" fill="#2E7D32" />
    <!-- Graduate Cap -->
    <path d="M22,28 L32,23 L42,28 L32,33 Z M26,30 L26,35 Q32,38 38,35 L38,30" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" />
    <text x="56" y="27" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0B2C5D">Education</text>
    <text x="56" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#6B7280">Scholarships</text>
  </g>

  <!-- Right Floating Badge: Sports Talent -->
  <g transform="translate(410, 290)">
    <rect width="140" height="60" rx="16" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(11,44,93,0.12))" />
    <circle cx="32" cy="30" r="16" fill="#E8720C" />
    <!-- Sports Star/Trophy -->
    <path d="M26,24 L38,24 L36,32 Q32,36 28,32 Z M32,36 L32,39 M28,39 L36,39" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="56" y="27" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0B2C5D">Sports Kits</text>
    <text x="56" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#6B7280">Young Athletes</text>
  </g>
</svg>
