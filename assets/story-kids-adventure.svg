<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="kidsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#kidsBg)"/>
  <!-- Sun & Clouds -->
  <circle cx="320" cy="90" r="40" fill="#fde047"/>
  <ellipse cx="100" cy="110" rx="50" ry="20" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="140" cy="100" rx="40" ry="25" fill="#ffffff" opacity="0.8"/>
  <!-- Jungle Hills -->
  <circle cx="80" cy="460" r="160" fill="#166534"/>
  <circle cx="320" cy="440" r="180" fill="#15803d"/>
  <!-- Children silhouette running with dog -->
  <g transform="translate(100, 350)">
    <!-- Kid 1 -->
    <circle cx="40" cy="30" r="12" fill="#052e16"/>
    <rect x="34" y="42" width="12" height="30" rx="3" fill="#052e16"/>
    <!-- Kid 2 -->
    <circle cx="80" cy="35" r="11" fill="#052e16"/>
    <rect x="74" y="46" width="12" height="26" rx="3" fill="#052e16"/>
    <!-- Dog -->
    <ellipse cx="130" cy="65" rx="18" ry="10" fill="#052e16"/>
    <circle cx="144" cy="55" r="7" fill="#052e16"/>
  </g>
</svg>
