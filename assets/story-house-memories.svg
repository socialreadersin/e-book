<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="horrorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020d18"/>
      <stop offset="60%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#06131c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#horrorBg)"/>
  <circle cx="260" cy="150" r="70" fill="url(#moonGlow)"/>
  <circle cx="260" cy="150" r="25" fill="#f0f9ff"/>
  <!-- Bare Creepy Trees -->
  <path d="M40,420 Q70,300 50,220 Q70,250 80,180 Q90,260 120,320" stroke="#03080e" stroke-width="4" fill="none"/>
  <!-- Haunted Mansion Silhouette with glowing windows -->
  <g transform="translate(80, 240)">
    <!-- House roof & walls -->
    <polygon points="120,60 40,120 200,120" fill="#040910"/>
    <rect x="50" y="120" width="140" height="110" fill="#040910"/>
    <!-- Tower -->
    <polygon points="180,30 160,70 200,70" fill="#040910"/>
    <rect x="165" y="70" width="30" height="60" fill="#040910"/>
    <!-- Glowing yellow windows -->
    <rect x="70" y="140" width="18" height="24" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="110" y="140" width="18" height="24" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="150" y="140" width="18" height="24" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="90" y="180" width="18" height="28" rx="2" fill="#fbbf24" opacity="0.9"/>
    <rect x="130" y="180" width="18" height="28" rx="2" fill="#fbbf24" opacity="0.9"/>
  </g>
  <!-- Hill & Fog -->
  <path d="M0,560 L400,560 L400,430 C280,390 140,420 0,440 Z" fill="#02060a"/>
</svg>
