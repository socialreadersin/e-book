<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2C5D"/>
      <stop offset="40%" stop-color="#103b7b"/>
      <stop offset="100%" stop-color="#071b3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E8720C"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#dealBg)"/>

  <!-- Decorative Ambient Circles -->
  <circle cx="1100" cy="80" r="260" fill="#E8720C" opacity="0.18" filter="blur(50px)"/>
  <circle cx="150" cy="420" r="220" fill="#2E7D32" opacity="0.22" filter="blur(40px)"/>
  <circle cx="850" cy="380" r="180" fill="#3B82F6" opacity="0.2" filter="blur(40px)"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Left Content Area -->
  <!-- Top Deal Pill -->
  <g transform="translate(80, 60)">
    <rect width="320" height="38" rx="19" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <circle cx="22" cy="19" r="6" fill="#FFF" opacity="0.9"/>
    <text x="38" y="24" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="14" letter-spacing="1">⚡ GRAND MEGA BOOK FAIR</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="160" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">
    Upgrade Your Mind.
  </text>
  <text x="80" y="220" fill="url(#goldGrad)" font-family="'Poppins', sans-serif" font-weight="900" font-size="48" letter-spacing="-0.5">
    Flat 40% - 60% Off
  </text>

  <!-- Subtitle -->
  <text x="80" y="270" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="500" font-size="18">
    Bestselling E-Books &amp; Audiobooks in English &amp; Tamil.
  </text>
  <text x="80" y="300" fill="#93C5FD" font-family="'Inter', sans-serif" font-weight="600" font-size="16">
    Every purchase allocates 25% directly to rural student education.
  </text>

  <!-- Trust Highlights Mini Bar -->
  <g transform="translate(80, 335)">
    <!-- Point 1 -->
    <rect width="170" height="34" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
    <text x="14" y="22" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="13">✓ Instant Download</text>

    <!-- Point 2 -->
    <rect x="180" width="190" height="34" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
    <text x="194" y="22" fill="#FCD34D" font-family="'Inter', sans-serif" font-weight="700" font-size="13">★ 4.9/5 Rated Reads</text>

    <!-- Point 3 -->
    <rect x="380" width="160" height="34" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
    <text x="394" y="22" fill="#FB923C" font-family="'Inter', sans-serif" font-weight="700" font-size="13">♥ 25% Social Fund</text>
  </g>

  <!-- Right Visual Composition: 3D Stack of Book Covers with Badges -->
  <g transform="translate(740, 50)" filter="url(#shadow)">
    <!-- Book 1 (Background left tilted) -->
    <g transform="translate(0, 40) rotate(-8)">
      <rect width="180" height="260" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <rect x="10" y="10" width="160" height="240" rx="8" fill="#10B981"/>
      <text x="90" y="110" fill="#FFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="16" text-anchor="middle">MINDSET</text>
      <text x="90" y="135" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">Carol Dweck</text>
      <rect x="25" y="180" width="130" height="28" rx="14" fill="#047857"/>
      <text x="90" y="198" fill="#FFF" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" text-anchor="middle">₹179 Only</text>
    </g>

    <!-- Book 2 (Background right tilted) -->
    <g transform="translate(190, 30) rotate(10)">
      <rect width="180" height="260" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <rect x="10" y="10" width="160" height="240" rx="8" fill="#3B82F6"/>
      <text x="90" y="105" fill="#FFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="16" text-anchor="middle">WINGS OF FIRE</text>
      <text x="90" y="130" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12" text-anchor="middle">Dr. APJ Abdul Kalam</text>
      <rect x="25" y="180" width="130" height="28" rx="14" fill="#1D4ED8"/>
      <text x="90" y="198" fill="#FFF" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" text-anchor="middle">₹159 Only</text>
    </g>

    <!-- Book 3 (Center Hero Front) -->
    <g transform="translate(85, 10)">
      <rect width="210" height="300" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
      <!-- Inner cover -->
      <rect x="12" y="12" width="186" height="276" rx="10" fill="#F59E0B"/>
      
      <!-- Bestseller Tag on Front Book -->
      <rect x="24" y="24" width="105" height="24" rx="6" fill="#DC2626"/>
      <text x="76" y="40" fill="#FFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="10" text-anchor="middle">★ #1 BESTSELLER</text>

      <text x="105" y="110" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="900" font-size="20" text-anchor="middle">ATOMIC</text>
      <text x="105" y="138" fill="#0F172A" font-family="'Poppins', sans-serif" font-weight="900" font-size="20" text-anchor="middle">HABITS</text>
      <text x="105" y="165" fill="#451A03" font-family="'Inter', sans-serif" font-weight="700" font-size="13" text-anchor="middle">James Clear</text>

      <!-- Price & Cause Ribbon on Cover -->
      <rect x="24" y="200" width="162" height="42" rx="10" fill="#0B2C5D"/>
      <text x="105" y="222" fill="#FCD34D" font-family="'Poppins', sans-serif" font-weight="800" font-size="15" text-anchor="middle">₹149 <tspan font-size="11" fill="#94A3B8" text-decoration="line-through">₹299</tspan></text>
      <text x="105" y="236" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">25% (₹37.25) to Education</text>
    </g>

    <!-- Floating Discount Badge -->
    <g transform="translate(240, 270)" filter="url(#shadow)">
      <circle cx="45" cy="45" r="45" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
      <text x="45" y="38" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="900" font-size="18" text-anchor="middle">50%</text>
      <text x="45" y="56" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="12" text-anchor="middle">OFF</text>
    </g>
  </g>
</svg>
