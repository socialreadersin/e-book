    <text x="24" y="24" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="800" font-size="14" letter-spacing="1">STUDIO AUDIOBOOKS</text>
  </g>

  <text x="80" y="160" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">
    Listen on the Go.
  </text>
  <text x="80" y="220" fill="#F472B6" font-family="'Poppins', sans-serif" font-weight="900" font-size="48" letter-spacing="-0.5">
