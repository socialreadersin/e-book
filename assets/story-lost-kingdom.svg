<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="fantasySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#fantasySky)"/>
  <!-- Glowing Celestial Star -->
  <circle cx="280" cy="180" r="80" fill="url(#starGlow)"/>
  <circle cx="280" cy="180" r="14" fill="#ffffff"/>
  <!-- Floating spires & rocks -->
  <polygon points="120,240 140,160 160,240" fill="#1e1b4b" opacity="0.8"/>
  <polygon points="60,260 90,140 120,260" fill="#0f172a" opacity="0.9"/>
  <!-- Mist & Forest Mountain -->
  <path d="M0,560 L400,560 L400,380 C320,340 240,410 160,360 C80,310 0,390 0,390 Z" fill="#090d16"/>
  <path d="M0,560 L400,560 L400,440 C310,400 220,470 120,430 L0,480 Z" fill="#020617"/>
  <!-- Hero Silhouette looking up -->
  <g transform="translate(170, 370)">
    <circle cx="30" cy="20" r="10" fill="#38bdf8" opacity="0.3"/>
    <circle cx="30" cy="20" r="7" fill="#020617"/>
    <path d="M15,90 C15,50 20,30 30,30 C40,30 45,50 45,90 Z" fill="#020617"/>
    <path d="M22,80 L8,100 L30,95 L52,100 L38,80 Z" fill="#020617"/>
  </g>
</svg>
