<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="romanceSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="35%" stop-color="#db2777"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#romanceSunset)"/>
  <!-- Setting Sun on Sea -->
  <circle cx="200" cy="320" r="80" fill="url(#sunGlow)"/>
  <circle cx="200" cy="320" r="30" fill="#fffbeb"/>
  <!-- Sea horizon & sparkling reflection -->
  <rect x="0" y="320" width="400" height="240" fill="#c2410c" opacity="0.4"/>
  <ellipse cx="200" cy="360" rx="90" ry="8" fill="#fde047" opacity="0.6"/>
  <ellipse cx="200" cy="400" rx="140" ry="10" fill="#fef08a" opacity="0.4"/>
  <!-- Beach Shoreline -->
  <path d="M0,560 L400,560 L400,440 C280,420 180,450 0,430 Z" fill="#2d0b28"/>
  <!-- Couple Silhouette holding hands at sunset -->
  <g transform="translate(140, 340)">
    <!-- Woman -->
    <circle cx="35" cy="25" r="9" fill="#150318"/>
    <path d="M22,85 C22,45 28,34 35,34 C42,34 48,45 48,85 Z" fill="#150318"/>
    <path d="M20,60 C15,80 18,105 35,105 C52,105 55,80 50,60 Z" fill="#150318"/>
    <!-- Man -->
    <circle cx="75" cy="20" r="10" fill="#150318"/>
    <path d="M62,95 L65,30 C68,28 82,28 85,30 L88,95 Z" fill="#150318"/>
    <!-- Joined arms -->
    <path d="M42,50 Q55,65 68,50" stroke="#150318" stroke-width="5" fill="none"/>
  </g>
</svg>
