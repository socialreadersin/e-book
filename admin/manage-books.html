<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Books &amp; Audiobooks | Admin — Social Readers</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0B2C5D',
            forest: '#2E7D32',
            brandOrange: '#E8720C',
            cream: '#FAF7F2',
          },
          fontFamily: {
            heading: ['Poppins', 'Noto Sans Tamil', 'sans-serif'],
            body: ['Inter', 'Noto Sans Tamil', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#FAF7F2] text-gray-800 min-h-screen flex">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-navy text-white flex-shrink-0 hidden md:flex flex-col justify-between p-6">
    <div class="space-y-8">
      
      <!-- Brand -->
      <a href="../index.html" class="flex flex-col">
        <div class="flex items-center gap-1">
          <span class="text-xl font-extrabold text-white">SOCIAL</span>
          <span class="text-xl font-extrabold text-green-400">READERS</span>
        </div>
        <span class="text-[10px] tracking-widest text-orange-300 font-bold uppercase mt-0.5">Admin Console</span>
      </a>

      <!-- Menu Items -->
      <nav class="space-y-2">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white font-medium text-sm transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          <span>Dashboard</span>
        </a>

        <a href="manage-books.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 text-white font-bold text-sm">
          <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          <span>Manage Books</span>
        </a>

        <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white font-medium text-sm transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
          <span>Orders &amp; Receipts</span>
        </a>

        <a href="categories.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white font-medium text-sm transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
          <span>Categories</span>
        </a>

        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5 hover:text-white font-medium text-sm transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span>Settings</span>
        </a>
      </nav>

    </div>

    <div class="pt-6 border-t border-white/10 text-xs text-gray-400 flex items-center justify-between">
      <span>Admin: S. Raman</span>
      <a href="login.html" class="text-orange-300 hover:underline">Logout</a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-grow flex flex-col min-w-0">
    
    <!-- Top Header -->
    <header class="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-navy">Manage Books &amp; Audiobooks</h1>
      </div>

      <div class="flex items-center gap-4">
        <button id="open-add-book-modal" class="px-4 py-2 rounded-full bg-forest text-white font-bold text-xs hover:bg-green-800 transition-colors shadow-sm flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>Add New Title</span>
        </button>
      </div>
    </header>

    <!-- Books Management Table -->
    <main class="p-6 sm:p-8 space-y-6 flex-grow">
      
      <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 sm:p-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h2 class="text-lg font-bold text-navy">Catalog Inventory</h2>
            <p class="text-xs text-gray-500">Live listings available across web store</p>
          </div>
          <div class="w-full sm:w-64">
            <input type="text" id="admin-search-books" placeholder="Search by title..." class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead class="bg-[#FAF7F2] text-navy font-bold border-b border-gray-200">
              <tr>
                <th class="p-3 sm:p-4">Cover</th>
                <th class="p-3 sm:p-4">Title &amp; Author</th>
                <th class="p-3 sm:p-4">Format</th>
                <th class="p-3 sm:p-4">Price</th>
                <th class="p-3 sm:p-4">25% Cause Share</th>
                <th class="p-3 sm:p-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="books-table-body" class="divide-y divide-gray-100 text-gray-600">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>

    </main>

  </div>

  <!-- ADD / EDIT BOOK MODAL -->
  <div id="book-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-gray-100 relative max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-title" class="text-xl font-extrabold text-navy">Add New Title</h3>
        <button id="close-modal-btn" class="p-2 text-gray-400 hover:text-navy">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <form id="book-form" class="space-y-4">
        <input type="hidden" id="book-id">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Title (English) *</label>
            <input type="text" id="form-title-en" required class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Title (Tamil / தமிழ்) *</label>
            <input type="text" id="form-title-ta" required class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Author (English) *</label>
            <input type="text" id="form-author-en" required class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Author (Tamil / தமிழ்) *</label>
            <input type="text" id="form-author-ta" required class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Price (₹ INR) *</label>
            <input type="number" id="form-price" min="10" required value="149" class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Format *</label>
            <select id="form-type" class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
              <option value="both">E-Book + Audiobook</option>
              <option value="ebook">E-Book Only</option>
              <option value="audiobook">Audiobook Only</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-navy mb-1">Category *</label>
            <select id="form-category" class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy">
              <option value="selfdev">Self Development</option>
              <option value="business">Business &amp; Finance</option>
              <option value="health">Health &amp; Mindset</option>
              <option value="biography">Biographies</option>
            </select>
          </div>
        </div>

        <!-- Cloudinary Uploads: Cover Image & Raw PDF / MP3 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
          <div class="p-4 rounded-2xl bg-gray-50 border border-gray-200">
            <label class="block text-xs font-bold text-navy mb-1">Cover Image (Cloudinary)</label>
            <input type="file" id="form-cover-file" accept="image/*" class="text-xs text-gray-500">
            <input type="hidden" id="form-cover-url">
          </div>

          <div class="p-4 rounded-2xl bg-gray-50 border border-gray-200">
            <label class="block text-xs font-bold text-navy mb-1">Digital File (PDF/MP3 via resource_type: raw)</label>
            <input type="file" id="form-raw-file" accept=".pdf,.epub,.mp3" class="text-xs text-gray-500">
            <input type="hidden" id="form-raw-url">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-navy mb-1">Description (English)</label>
          <textarea id="form-desc-en" rows="3" class="w-full px-3.5 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-navy"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" id="cancel-modal-btn" class="px-5 py-2 text-xs text-gray-500 hover:text-navy font-semibold">
            Cancel
          </button>
          <button type="submit" class="px-6 py-2 rounded-full bg-forest text-white text-xs font-bold hover:bg-green-800 transition-colors shadow-sm">
            Save Title
          </button>
        </div>
      </form>

    </div>
  </div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cloudinary.js"></script>
  <script>
    // Security check
    SocialReadersAuth.requireAdmin();

    function renderBooksTable() {
      const books = SocialReadersDB.getBooks();
      const tbody = document.getElementById('books-table-body');
      
      tbody.innerHTML = books.map(book => {
        const title = typeof book.title === 'object' ? book.title.en : book.title;
        const author = typeof book.author === 'object' ? book.author.en : book.author;
        const causeShare = (book.price * 0.25).toFixed(2);
        const formatBadge = book.type === 'both' ? 'E-Book + Audio' : (book.type === 'audiobook' ? 'Audiobook' : 'E-Book');

        return `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="p-3 sm:p-4">
              <img src="../${book.coverUrl}" class="w-10 h-12 object-contain rounded bg-white p-1 border border-gray-100" alt="${title}">
            </td>
            <td class="p-3 sm:p-4">
              <span class="font-bold text-navy block">${title}</span>
              <span class="text-xs text-gray-400">${author}</span>
            </td>
            <td class="p-3 sm:p-4">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${book.type === 'audiobook' ? 'bg-orange-100 text-brandOrange' : 'bg-blue-100 text-navy'}">
                ${formatBadge}
              </span>
            </td>
            <td class="p-3 sm:p-4 font-bold text-navy">₹${book.price}</td>
            <td class="p-3 sm:p-4 font-bold text-brandOrange">₹${causeShare}</td>
            <td class="p-3 sm:p-4 text-right space-x-2">
              <button onclick="editBook('${book.id}')" class="text-xs text-navy font-bold hover:underline">Edit</button>
              <button onclick="deleteBook('${book.id}')" class="text-xs text-red-500 font-bold hover:underline">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    const modal = document.getElementById('book-modal');
    document.getElementById('open-add-book-modal').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Add New Title';
      document.getElementById('book-form').reset();
      document.getElementById('book-id').value = '';
      document.getElementById('form-cover-url').value = 'assets/cover-atomic-habits.svg';
      modal.classList.remove('hidden');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('cancel-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

    document.getElementById('book-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('book-id').value || `b_${Date.now()}`;
      const titleEn = document.getElementById('form-title-en').value;
      const titleTa = document.getElementById('form-title-ta').value;
      const authorEn = document.getElementById('form-author-en').value;
      const authorTa = document.getElementById('form-author-ta').value;
      const price = Number(document.getElementById('form-price').value);
      const type = document.getElementById('form-type').value;
      const category = document.getElementById('form-category').value;
      const descEn = document.getElementById('form-desc-en').value;
      let coverUrl = document.getElementById('form-cover-url').value || 'assets/cover-atomic-habits.svg';

      const coverFile = document.getElementById('form-cover-file').files[0];
      if (coverFile) {
        coverUrl = await SocialReadersCloudinary.uploadImage(coverFile);
      }

      const books = SocialReadersDB.getBooks();
      const existingIdx = books.findIndex(b => b.id === id);

      const bookObj = {
        id,
        title: { en: titleEn, ta: titleTa },
        author: { en: authorEn, ta: authorTa },
        price,
        type,
        category,
        coverUrl,
        isBestseller: false,
        description: { en: descEn, ta: descEn }
      };

      if (existingIdx >= 0) {
        books[existingIdx] = bookObj;
      } else {
        books.push(bookObj);
      }

      SocialReadersDB.saveBooks(books);
      modal.classList.add('hidden');
      renderBooksTable();
    });

    window.editBook = function(id) {
      const book = SocialReadersDB.getBookById(id);
      if (!book) return;
      document.getElementById('modal-title').textContent = 'Edit Title';
      document.getElementById('book-id').value = book.id;
      document.getElementById('form-title-en').value = typeof book.title === 'object' ? book.title.en : book.title;
      document.getElementById('form-title-ta').value = typeof book.title === 'object' ? book.title.ta : book.title;
      document.getElementById('form-author-en').value = typeof book.author === 'object' ? book.author.en : book.author;
      document.getElementById('form-author-ta').value = typeof book.author === 'object' ? book.author.ta : book.author;
      document.getElementById('form-price').value = book.price;
      document.getElementById('form-type').value = book.type || 'both';
      document.getElementById('form-category').value = book.category || 'selfdev';
      document.getElementById('form-desc-en').value = typeof book.description === 'object' ? book.description.en : (book.description || '');
      document.getElementById('form-cover-url').value = book.coverUrl;
      modal.classList.remove('hidden');
    };

    window.deleteBook = function(id) {
      if (confirm('Are you sure you want to remove this title from the catalog?')) {
        let books = SocialReadersDB.getBooks();
        books = books.filter(b => b.id !== id);
        SocialReadersDB.saveBooks(books);
        renderBooksTable();
      }
    };

    document.addEventListener('DOMContentLoaded', renderBooksTable);
  </script>
</body>
</html>
