<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Social Readers</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0B2C5D',
            forest: '#2E7D32',
            brandOrange: '#E8720C',
            cream: '#FAF7F2',
          },
          fontFamily: {
            heading: ['Poppins', 'Noto Sans Tamil', 'sans-serif'],
            body: ['Inter', 'Noto Sans Tamil', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#FAF7F2] text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Top bar with Back Link & Language Switch -->
  <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 flex justify-between items-center">
    <a href="../index.html" class="text-xs font-bold text-navy hover:text-forest flex items-center gap-1">
      &larr; Back to Social Readers Store
    </a>
    <button type="button" class="lang-toggle-btn px-3.5 py-1.5 rounded-full border border-navy text-navy font-bold text-xs hover:bg-navy hover:text-white transition-all">
      EN | த
    </button>
  </div>

  <!-- Login Form Center Box -->
  <div class="flex-grow flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 border border-gray-100 shadow-xl space-y-6">
      
      <!-- Brand Header -->
      <div class="text-center space-y-2">
        <div class="flex items-center justify-center gap-1.5">
          <span class="text-2xl font-extrabold tracking-tight text-navy">SOCIAL</span>
          <span class="text-2xl font-extrabold tracking-tight text-forest">READERS</span>
        </div>
        <h1 data-i18n="admin.login.title" class="text-xl font-bold text-navy pt-2">Admin Portal Login</h1>
        <p data-i18n="admin.login.subtitle" class="text-xs text-gray-400">Social Readers Management Console</p>
      </div>

      <div id="login-error" class="hidden p-3 rounded-xl bg-red-50 text-red-600 text-xs font-semibold text-center border border-red-200"></div>

      <!-- Login Form -->
      <form id="admin-login-form" class="space-y-4">
        <div>
          <label data-i18n="admin.login.email" class="block text-xs font-bold text-navy mb-1.5">Admin Email</label>
          <input 
            type="email" 
            id="admin-email"
            required 
            value="admin@socialreaders.org" 
            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-navy focus:bg-white transition-colors"
          >
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label data-i18n="admin.login.password" class="block text-xs font-bold text-navy">Password</label>
          </div>
          <input 
            type="password" 
            id="admin-password"
            required 
            value="admin123" 
            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:border-navy focus:bg-white transition-colors"
          >
        </div>

        <div class="pt-2">
          <button 
            type="submit" 
            data-i18n="admin.login.submit"
            class="w-full py-3.5 rounded-xl bg-navy text-white font-bold text-sm hover:bg-blue-950 transition-all shadow-md"
          >
            Sign In to Console
          </button>
        </div>
      </form>

      <!-- Credentials Note -->
      <div class="p-3 rounded-xl bg-blue-50/70 border border-blue-100 text-center text-xs text-navy/80">
        Demo admin credentials prefilled (<code>admin@socialreaders.org</code> / <code>admin123</code>).
      </div>

    </div>
  </div>

  <!-- Footer Info -->
  <div class="text-center py-6 text-xs text-gray-400">
    © 2026 Social Readers Foundation. Internal Management Console.
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/i18n.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();
      const errorDiv = document.getElementById('login-error');

      const result = SocialReadersAuth.loginAdmin(email, password);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorDiv.textContent = result.message;
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
